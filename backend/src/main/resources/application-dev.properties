# Local development / class demo profile.
# Runs entirely in memory - no PostgreSQL install required.
# Activate with:  SPRING_PROFILES_ACTIVE=dev   (or use run-backend.cmd / run-backend.sh)

# H2 in PostgreSQL compatibility mode so the Flyway migrations run unchanged
spring.datasource.url=jdbc:h2:mem:codebridge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway builds the schema; Hibernate only checks it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fixed demo login (instead of a random generated password).
# The Vite dev server sends these for you - see frontend/.env.example
spring.security.user.name=${CODEBRIDGE_USER:demo}
spring.security.user.password=${CODEBRIDGE_PASSWORD:demo123}
